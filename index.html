<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>taquito reads</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f6f4ef;
      display: flex;
      justify-content: center;
      font-family: georgia, serif;
    }

    .page {
      max-width: 1100px;
      padding: 40px;
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    .top {
      display: flex;
      gap: 40px;
      align-items: flex-start;
    }

    .column {
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    /* ===== Goodreads update widget ===== */
    #gr_updates_widget{
      border-radius: 5px;
      background-color:#fff;
      border:solid #683205 10px;
      box-shadow: 0px 0px 4px 1px #595959,
                  inset 0px 0px 0px 1px #7D730B;
      padding:15px 0 35px 15px;
      width:250px;
      height:330px;
    }

    #gr_footer img{
      width:100px;
      float:left;
    }
	  
    iframe {
      border: none;
    }
  </style>
</head>

<body>
  <div class="page">

    <!-- ===== TOP SECTION ===== -->
    <div class="top">

      <!-- LEFT COLUMN -->
      <div class="column">
        <div id="gr_updates_widget">
          <iframe
            sandbox
            src="https://www.goodreads.com/widgets/user_update_widget?num_updates=3&user=143071204"
            width="248"
            height="330">
          </iframe>

          <div id="gr_footer">
            <a href="https://www.goodreads.com/" rel="nofollow">
              <img src="https://s.gr-assets.com/images/layout/goodreads_logo_140.png" alt="Goodreads">
            </a>
          </div>
        </div>
      </div>

      <!-- RIGHT COLUMN -->
      <div class="column">

        <!-- READ SHELF BADGE -->
        <div>
          <span style="color:#382110">my read shelf:</span><br/>
          <a href="https://www.goodreads.com/review/list/143071204?shelf=read" rel="nofollow">
            <img src="https://s.gr-assets.com/images/badge/badge1.jpg" alt="Read shelf">
          </a>
        </div>

        <!-- QUOTES -->
        <div style="border:2px solid #EBE8D5; border-radius:10px; padding:10px">
          <h3>
            <a href="https://www.goodreads.com/user/show/143071204-taquito"
               style="text-decoration:none;color:#aaa;font-style:italic"
               rel="nofollow">
              taquito’s quotes
            </a>
          </h3>
          <div id="gr_quote_body"></div>
          <script src="https://www.goodreads.com/quotes/widget/143071204-taquito?v=2"></script>
        </div>

        <!-- READING CHALLENGE -->
        <div id="gr_challenge_11680" style="border:2px solid #EBE8D5; border-radius:10px; padding:10px; max-width:230px">
          <script src="https://www.goodreads.com/user_challenges/widget/143071204-taquito?challenge_id=11680&v=2"></script>
        </div>

      </div>
    </div>

    <!-- ===== BOTTOM SECTION: RECENT READS ===== -->
    <div>
      <script src="https://www.goodreads.com/review/grid_widget/143071204.taquito's%20recent%20reads?cover_size=medium&num_books=20&order=d&shelf=read&sort=date_read"></script>
    </div>

  </div>
</body>
</html>
